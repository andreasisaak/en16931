[alias]
# `cargo xtask <task>` — see xtask/src/main.rs.
xtask = "run --package xtask --release --"

[env]
# Where `cargo xtask fetch` puts the third-party reference corpus (CEN / KoSIT /
# Peppol artefacts — EUPL-1.2 and vendor terms, so never committed), and where
# `xtask` and the artefact suites read it. Defined here, once, so no published
# file has to name the location. Resolved against the workspace root.
EN16931_REFERENCE = { value = "concepts/reference", relative = true }
