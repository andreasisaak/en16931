[package]
name        = "en16931-formats"
description = """\
UBL 2.1, UN/CEFACT CII and ZUGFeRD / Factur-X for the EN 16931 e-invoice: \
read, receive, write and convert documents in both syntaxes, and extract or \
embed the invoice in a PDF/A-3 hybrid. The business rules come from en16931.\
"""
keywords   = ["einvoice", "en16931", "ubl", "zugferd", "xrechnung"]
categories = ["finance", "encoding", "parser-implementations"]
readme     = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# UBL 2.1, both directions.
default = ["ubl"]
ubl = ["dep:roxmltree"]
# UN/CEFACT CII D16B, both directions.
cii = ["dep:roxmltree"]
# ZUGFeRD / Factur-X: `extract` and `embed`. Off by default: it takes the graph
# from 13 crates to 57 and does not build for `wasm32-unknown-unknown`.
zugferd = ["dep:lopdf", "dep:flate2", "cii"]
# `serde` on this crate's own public types.
serde = ["dep:serde", "en16931/serde"]

[dependencies]
en16931.workspace   = true
thiserror.workspace = true
# The same `rust_decimal` as `en16931`, so there is one `Decimal` type.
rust_decimal.workspace = true

# Reading XML only; the writers need no dependency.
roxmltree = { workspace = true, optional = true }

# PDF parsing and writing for `zugferd`, without its date and threading features.
lopdf = { version = "0.44", default-features = false, optional = true }
# Strict, bounded `/FlateDecode` inflation. Already in the graph through `lopdf`.
flate2 = { version = "1.1", optional = true }

serde = { workspace = true, optional = true }

[[example]]
name              = "zugferd_extract"
required-features = ["zugferd"]

[[example]]
name              = "write_both_syntaxes"
required-features = ["ubl"]

[[example]]
name              = "read_and_validate"
required-features = ["ubl"]

[dev-dependencies]
# The workspace entry with the features the suites need (a path-only
# dependency would be a wildcard, which `deny.toml` bans).
en16931      = { workspace = true, features = ["serde", "billing", "svrl"] }
# `tests/billing_seam.rs`: a derived `billing` document through both writers.
billing      = "0.16"
lopdf        = { version = "0.44", default-features = false }
proptest     = "1.11"
# The suites parse what the writers emit under every feature set.
roxmltree    = { workspace = true }
rust_decimal = { workspace = true, features = ["macros"] }
serde_json   = "1"
criterion    = { version = "0.7", features = ["html_reports"] }
# `tests/zugferd_embed.rs`: veraPDF in its Docker image, started once per run.
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }

[[bench]]
name    = "syntax"
harness = false
# Compares both syntaxes and times the conversion; `just bench` runs it.
required-features = ["ubl", "cii"]
