[package]
name        = "en16931"
description = """\
The EN 16931 European e-invoice semantic model and its business rules as Rust \
types: build, reconcile and validate an invoice against EN 16931, XRechnung \
and Peppol BIS Billing 3.0, and get a typed proof of validity. No XML, no I/O.\
"""
keywords   = ["einvoice", "en16931", "invoice", "xrechnung", "peppol"]
categories = ["finance", "data-structures"]
readme     = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# IBAN checks against the ISO 13616 registry (not only mod-97-10) and the
# `EN-SEPA-01` creditor-identifier check on BT-90, via the `sepa` crate.
sepa = ["dep:sepa"]
# Render a report as SVRL. Adds no dependencies.
svrl = []
# `serde` on all public types; types with invariants re-check them on deserialisation.
serde = ["dep:serde", "rust_decimal/serde"]
# Convert to and from `chrono::NaiveDate`.
chrono = ["dep:chrono"]
# Convert to and from `time::Date`.
time = ["dep:time"]
# `billing_adapter::from_billing`: a `billing` 0.16 document and a header to an invoice.
billing = ["dep:billing"]

[dependencies]
# Two required dependencies; everything else is optional.
rust_decimal.workspace = true
thiserror.workspace    = true

billing = { version = "0.16", optional = true }
serde   = { workspace = true, optional = true }
chrono  = { version = "0.4", optional = true, default-features = false }
time    = { version = "0.3", optional = true, default-features = false }
sepa    = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest  = "1.11.0"
# Test-only: the artefact suites read the reference corpus's XML.
roxmltree    = { workspace = true }
rust_decimal = { workspace = true, features = ["macros"] }
serde_json   = "1"

[[example]]
name              = "report_formats"
required-features = ["serde", "svrl"]

[[bench]]
name    = "validate"
harness = false
