[package]
name        = "en16931-cli"
description = """\
The EN 16931 e-invoice validator as a command: validate UBL, CII and \
ZUGFeRD / Factur-X PDFs against EN 16931, XRechnung and Peppol BIS Billing 3.0, \
convert between UBL and CII, extract and embed ZUGFeRD payloads, and compare \
two documents as invoices. Reports as text, JSON or SVRL.\
"""
keywords   = ["einvoice", "en16931", "xrechnung", "zugferd", "cli"]
categories = ["command-line-utilities", "finance"]
readme     = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

# The package is `en16931-cli`, the command `en16931`. `doc = false`: its docs
# would collide with the library's `en16931/index.html`.
[[bin]]
name = "en16931"
path = "src/main.rs"
doc  = false

[dependencies]
# Every feature on: a binary is in nobody's dependency graph.
en16931 = { workspace = true, features = ["serde", "svrl", "sepa"] }
en16931-formats = { workspace = true, features = ["ubl", "cii", "zugferd", "serde"] }

# `diff` compares numbers by value ("25.0" and "25" are one rate).
rust_decimal = { workspace = true }
clap        = { version = "4.6", features = ["derive", "wrap_help"] }
serde_json  = "1"
thiserror.workspace = true
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
roxmltree = "0.21"
rust_decimal.workspace = true
